; touhou_hfr configuration
[launcher]
; executable started by touhou_hfr.exe (empty = detect supported game, prefer English within that game)
exe=

[hfr]
; ticks per second. 0 = automatic (the display's current refresh rate)
fps=0
; 1 = vsync (recommended), 0 = software limiter only
vsync=1
; 1 = sub-step gameplay systems (smooth motion). 0 = keep stock 60 Hz logic, only present at high rate.
substep=1
; write touhou_hfr.log next to the game
log=1
; verbose state dump in the log (troubleshooting)
debug=0
; refresh rate to request in exclusive fullscreen (0 = same as fps / automatic)
fullscreen_refresh=0
; enemies (ECL) keep stock 60 Hz logic; 1 = render their sprites at positions interpolated between frames
enemy_interp=1
; 1 = poll the keyboard/joystick every tick and feed movement + focus to the player between frames
;     (per-tick inputs are stored in replays and reproduced on playback)
subtick_input=1
; 1 = create the Direct3D device through Direct3D 9Ex (needed for max_frame_latency). 0 = stock Direct3D 9.
d3d9ex=1
; number of frames the driver may queue before Present blocks (1 = lowest display latency, 0 = driver default)
max_frame_latency=1
; windowed mode: use the flip presentation model (D3DSWAPEFFECT_FLIPEX) — experimental, off by default
flipex=0

[video]
; how the 640x480 image is placed in the window
;   0 = stretch to fill (ignores aspect ratio)
;   1 = fit, keeping the aspect ratio, black bars for the remainder
;   2 = pixel perfect: whole-number scale only, black bars for the remainder
scaling=1
; upscaling filter
;   0 = nearest (sharp, but pixel sizes are uneven at non-integer scales)
;   1 = bilinear (smooth, blurry)
;   2 = sharp bilinear (nearest to the next whole multiple, then bilinear for the remainder)
filter=2
; 1 = give the window a resize border so it can be any size
resizable=1
; 1 = while dragging the border, keep the window itself at the game's aspect ratio
snap_aspect=1
; what the game's fullscreen does
;   0 = leave it alone (exclusive fullscreen, switches the display to 640x480)
;   1 = borderless window covering the monitor at its own resolution
fullscreen_mode=1

[systems]
; per-system sub-stepping switches (1 = sub-step, 0 = stock 60 Hz behaviour for that system)
sub_BulletManager=1
sub_Player=1
sub_Bomb=0
sub_LaserManager=1
sub_ItemManager=1
sub_Gui=0
sub_Stage=1
sub_AnmManagerWorld=1
sub_AnmManagerUI=1
