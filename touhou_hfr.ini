; touhou_hfr configuration
[launcher]
; executable started by touhou_hfr.exe (empty = detect supported game, prefer English within that game)
exe=

[hfr]
; ticks per second. 0 = automatic (the display's current refresh rate)
fps=0
; 1 = vsync (recommended), 0 = software limiter only
vsync=1
; 1 = sub-step gameplay systems (smooth motion). 0 = keep stock 60 Hz logic, only present at high rate.
substep=1
; write touhou_hfr.log next to the game
log=1
; verbose state dump in the log (troubleshooting)
debug=0

; replay_trace: a debugging aid, and only useful with debug=1. It keeps the logic rate across
; replay playback instead of dropping to 60 for a replay that has no recorded rate, and it writes
; one line a game frame with the replay frame number and the player's position. Two playbacks of
; the same file then diff, and the first differing line is the frame the simulation diverged on.
; 60 lines a second, so leave it off unless you are chasing a desynchronisation.
replay_trace=0
; refresh rate to request in exclusive fullscreen (0 = same as fps / automatic)
fullscreen_refresh=0
; enemies (ECL) keep stock 60 Hz logic; 1 = render their sprites at positions interpolated between frames
enemy_interp=1
; 1 = poll the keyboard/joystick every tick and feed movement + focus to the player between frames
;     (per-tick inputs are stored in replays and reproduced on playback)
subtick_input=1
; 1 = create the Direct3D device through Direct3D 9Ex (needed for max_frame_latency). 0 = stock Direct3D 9.
d3d9ex=1
; number of frames the driver may queue before Present blocks (1 = lowest display latency, 0 = driver default)
max_frame_latency=1
; windowed mode: use the flip presentation model (D3DSWAPEFFECT_FLIPEX) — experimental, off by default
flipex=0

[video]
; -1 = notice by itself when another renderer in the process owns the picture (THRotator and
; the like) and leave it to that renderer; 1 = always; 0 = never, keep composing the picture
; here. In this mode the frame rate, smoothing, sub-stepping, dimming, replays and input all
; still work; the scaling mode, filters, sharpening, internal resolution, texture upscaling,
; window sizing and borderless fullscreen are that renderer's job instead.
external_renderer=-1
; how the 640x480 image is placed in the window
;   0 = stretch to fill (ignores aspect ratio)
;   1 = fit, keeping the aspect ratio, black bars for the remainder
;   2 = pixel perfect: whole-number scale only, black bars for the remainder
scaling=1
; upscaling filter, by name. Built in:
;   nearest        sharp, but pixel sizes are uneven at non-integer scales
;   bilinear       smooth, blurry
;   sharp-bilinear nearest to the next whole multiple, then bilinear for the remainder
;   mmpx           MMPX pixel-art magnifier (fixed 2x, then scaled to fit)
;   xbr-lv2        Hyllian's xBR-lv2, works at any scale
;   super-xbr      Hyllian's Super-xBR (three passes, fixed 2x). Smooth and cheap.
;   scalefx        Sp00kyFox's ScaleFX (five passes, fixed 3x). The one designed for
;                  pixel art: its output uses only colours from the original, so it
;                  does not ring or halo on sprite edges. The most expensive of these.
; Any .hlsl file in the shaders/ folder next to the game is offered here by its file
; name, and replaces a built-in filter of the same name. The log lists what was found.
filter=sharp-bilinear
; sharpening pass run over the finished picture, after the filter and the resample, at the
; window's resolution -- so what it sharpens is the soft edges a resample leaves, not the
; game's own pixels:
;   none          = off
;   cas           = AMD's Contrast Adaptive Sharpening: adds contrast where the
;                   neighbourhood has room for it, leaves hard edges alone, rarely rings
;   unsharp-mask  = the plain operator on luma, with a cap on how far a pixel can be pushed
; Any .hlsl file in the shaders/ folder marked "//! post" is offered here as well.
sharpen=none
; how strong, 0-100. Around 40-60 suits sharp-bilinear at non-integer sizes; the xBR
; family and ScaleFX need less. Adjustable live in the in-game menu.
sharpen_strength=50
; 1 = say so at startup when something else is presenting the game (a d3d9 wrapper such as
;     PivotDX9), because the scaling mode and borderless fullscreen below cannot take effect
;     while that is the case. Only shown when a setting you are using actually depends on it.
warn_wrapper=1
; 1 = give the window a resize border so it can be any size
resizable=1
; size of the window when the game starts, as a percentage of the game's own 640x480:
;   0   = leave it as the game made it
;   200 = 1280x960, 150 = 960x720, 300 = 1920x1440 (held to the screen if that is too big)
;   -1  = the largest whole multiple of 640x480 that fits the screen
; TH10's own dialog only offers a 640x480 window, and at that size every scaling mode and
; every filter look identical to the plain game -- there is nothing to scale. Set this, or
; drag the window border, to give them something to do.
window_scale=0
; 1 = while dragging the border, hold the window itself at the game's aspect ratio.
;     Off by default: with it on the window is always 4:3, so the black bars that the
;     scaling modes above produce never appear.
snap_aspect=0
; what the game's fullscreen does
;   0 = leave the window wherever the game puts it
;   1 = borderless window covering the monitor at its own resolution
; The game's original exclusive fullscreen (a 640x480 display mode switch) is not used
; either way: taking it would mean resetting the Direct3D device, which this game cannot
; survive -- it has no code to reload its textures afterwards. See RESOLUTION.md.
fullscreen_mode=1
; the mouse pointer in borderless fullscreen. The game hides it whenever it believes it is
; fullscreen, which over a borderless window means it vanishes like nowhere else on the
; desktop:
;   0 = hidden, as the game does
;   1 = always visible
;   2 = visible while the mouse moves, hidden two seconds after it stops
; The pointer is always shown while the in-game menu is open, whatever this says.
cursor=2
; virtual-key code that opens the in-game menu. 122 = F11, which this engine does not read;
; avoid Insert (45) and F10 (121), which the game uses for its own snapshot and options.
; The menu is mouse-driven, so the game keeps its own keyboard input while it is open.
; 0 disables the in-game menu entirely; every setting here works without it.
menu_key=122
; virtual-key code that steps the window through 640x480, 960x720, 1280x960 and borderless
; fullscreen, the way TH11 and later do on F10 themselves. Only used for a game that has no
; such key of its own (TH10); on the others the game's own F10 keeps working. 0 = off.
size_cycle_key=121
; draw the game at N times its own 640x480 before any of the scaling above (1 = as shipped).
; The game keeps every coordinate it has; only the number of pixels changes, so sprites
; land on real sub-pixel positions instead of snapping to whole 640x480 pixels -- a slow
; bullet at 360 Hz glides instead of stepping -- and the 3D backgrounds gain real detail.
; Sprite textures are still the game's own, magnified by its bilinear sampler, so the
; upscaling filters have little left to do at 2 or more; "nearest" or "bilinear" is the
; natural pairing. Games whose sprite snapping is not yet known only get the sharper
; rasterisation (the log says which). 2 for a 1280x960 window, 3 for 1920x1440. Restart to apply.
internal_scale=1
; magnify every texture the game loads N times with a pixel-art filter, once, when it is
; loaded (0 = off). Meant for internal_scale=N: the rasteriser then has the pixels and the
; sprites the detail, instead of a bilinear blur of the 640x480 art. Uses about 4x the video
; memory per texture (capped at 512 MB); textures the game redraws, such as dialogue text,
; are redone as they change.
texture_scale=0
; the filter used for that: xbr-lv2 (any scale), super-xbr or mmpx (2x), scalefx (3x), or
; any .hlsl in the shaders folder. A fixed-scale filter that does not match texture_scale is
; resampled to it.
texture_filter=xbr-lv2
; readability: fade what competes with the enemy's bullets, each in percent (0 = off, 100 = gone).
; The stage background fades towards black, everything else towards transparent. Enemies,
; bullets, lasers, the player and the interface are never touched; TH13's trance overlay is
; only partly affected. Applied in-stage only, immediately, and from the menu's Display tab.
dim_background=0
; the pickups: P, point and the like
dim_items=0
; the cosmetic effects: explosions, hit sparks, bullet cancels, particles
dim_effects=0
; the game's own extra class of thing (TH13: the divine spirits; nothing in TH10-TH12)
dim_special=0
; your own shots (and options)
dim_player_shots=0
; which swap chain reaches the screen. -1 decides automatically and is almost always right.
;   -1 = ours, unless a d3d9.dll wrapper (PivotDX9, dgVoodoo, ...) sits in the game folder
;    1 = always ours: the device is never reset, so resizing is free and Direct3D 9Ex stays on
;    0 = always the game's: resizing goes through Reset, which forces 9Ex off because a reset
;        with 9Ex destroys every game texture and the game cannot reload them
own_present=-1

[systems]
; per-system sub-stepping switches (1 = sub-step, 0 = stock 60 Hz behaviour for that system)
sub_BulletManager=1
sub_Player=1
sub_Bomb=0
sub_LaserManager=1
sub_ItemManager=1
sub_Gui=0
sub_Stage=1
sub_AnmManagerWorld=1
sub_AnmManagerUI=1

[fixed60]
; Experimental x64 / TH06 New Classic backend only. hfr.fps sets presentation rate.
; Gameplay, input and native replays retain a fixed 60 Hz simulation.
; 1 = interpolate sprite positions at draw time (up to one native frame of visual delay).
interpolate=1
; 1 = move the player between native frames from freshly polled input (sub-tick movement).
; Holding a direction still covers the stock distance per 60 Hz frame, but a direction change
; takes effect within the frame. Collision, shooting, scripts, enemies and bullets stay at
; 60 Hz. This changes the player's position at each 60 Hz boundary, so a replay recorded with
; it on will not play back faithfully; turn it off before watching a replay. Off by
; default, and inert at 60 Hz.
subtick=0
; 1 = advance enemy bullets a fraction of a frame at a time (sub-step), running their
; culling, grazing and collision at each step instead of once per 60 Hz frame. A bullet
; that would have jumped past you between two frames can now hit you, so this makes the
; game harder as well as smoother. Bullets are still exactly where the stock game would
; put them at every 60 Hz boundary. Lasers, enemies, items and scripts still run at 60 Hz.
; Recorded replays will not play back faithfully; turn it off before watching a replay.
; Off by default, and inert at 60 Hz.
substep=0
; Diagnostics: run for N seconds, then log the game's node lists and quit. 0 = never,
; which is what any normal install wants. Used to investigate a screen without a person
; at the machine.
diag_seconds=0
; D3D11 VSync. Separate from hfr.vsync to preserve existing D3D9 defaults.
; 0 = software limiter; 1 may cap actual presentation at the monitor refresh rate.
vsync=0
