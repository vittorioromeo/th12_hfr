; th12_hfr configuration
[launcher]
; executable started by th12_hfr.exe (empty = th12e.exe if present, else th12.exe)
exe=

[hfr]
; ticks per second. 0 = automatic (the display's current refresh rate)
fps=0
; 1 = vsync (recommended), 0 = software limiter only
vsync=1
; 1 = sub-step gameplay systems (smooth motion). 0 = keep stock 60 Hz logic, only present at high rate.
substep=1
; write th12_hfr.log next to the game
log=1
; verbose state dump in the log (troubleshooting)
debug=0
; refresh rate to request in exclusive fullscreen (0 = same as fps / automatic)
fullscreen_refresh=0
; enemies (ECL) keep stock 60 Hz logic; 1 = render their sprites at positions interpolated between frames
enemy_interp=1

[systems]
; per-system sub-stepping switches (1 = sub-step, 0 = stock 60 Hz behaviour for that system)
sub_BulletManager=1
sub_Player=1
sub_Bomb=0
sub_LaserManager=1
sub_ItemManager=1
sub_Gui=0
sub_Stage=1
sub_AnmManagerWorld=1
sub_AnmManagerUI=1
